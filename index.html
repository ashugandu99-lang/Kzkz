<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ V16: STABLE SNIPER</title>
    <style>
        :root { --neon: #00ff66; --bg: #000; --red: #ff003c; }
        body { background: #000; color: #fff; font-family: 'Courier New', monospace; margin: 0; padding: 0; overflow-x: hidden; }
        .header { background: #111; padding: 10px; border-bottom: 2px solid var(--neon); text-align: center; position: sticky; top: 0; z-index: 1000; }
        #flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 255, 102, 0.4); display: none; z-index: 9999; pointer-events: none; }
        #terminal { background: #050505; color: #0f0; font-size: 10px; padding: 10px; height: 140px; overflow-y: auto; border-bottom: 2px solid #222; }
        .controls { padding: 15px; text-align: center; }
        .btn-start { background: var(--neon); color: #000; border: none; padding: 18px; width: 90%; font-weight: 900; border-radius: 10px; cursor: pointer; font-size: 18px; }
        .container { padding: 10px; }
        .wallet-card { background: #111; border: 1px solid #333; border-radius: 15px; padding: 20px; margin-bottom: 15px; position: relative; }
        .new-hit { border-color: var(--neon) !important; box-shadow: 0 0 20px var(--neon); }
        .address-box { background: #000; border: 1px dashed var(--neon); padding: 15px; margin: 10px 0; border-radius: 8px; font-weight: bold; color: #fff; word-break: break-all; text-align: center; font-size: 14px; }
        .info { font-size: 12px; color: #aaa; margin: 5px 0; }
        .val { color: var(--neon); font-weight: bold; }
        .footer-time { font-size: 9px; color: #444; text-align: right; margin-top: 5px; }
    </style>
</head>
<body>

<div id="flash"></div>

<div class="header">
    <div style="font-size: 10px; color: var(--neon); letter-spacing: 1px;">● STABLE STREAM: 24H PERSISTENT</div>
    <h2 style="margin: 5px 0;">V16 STABLE SNIPER</h2>
</div>

<div id="terminal"></div>

<div class="controls">
    <button class="btn-start" id="startBtn" onclick="toggleEngine()">START SCANNING</button>
</div>

<div class="container" id="feed">
    <!-- Saved Data will show here -->
</div>

<audio id="alarm" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

<script>
    const API_KEY = "bef5327c-0eb9-407f-b9be-19ce06ef2e57";
    const CEX_WALLETS = {
        "5VCwKtYv8LBa9Bv68y3CznunF3D2asLidvXJStB66Yka": "Binance",
        "AC59pU99X9f32ZdfaHCqAtdtXnZpA3W7aQnC1aEnDEnS": "Bybit",
        "2AQdp621S9L8M7c5Pq9tAEn568YkaEnDEnS": "Coinbase",
        "ASTE8f7mYQ5vGq7Y9X2A8A1S9e7V4E7v7G7g7E7v7G7g": "MEXC",
        "u6YvS1B4toXfubks8E4UvUePHeVdf4m4v": "Kraken"
    };

    let seenSigs = new Set();
    let isRunning = false;
    let walletKeys = Object.keys(CEX_WALLETS);
    let currentIndex = 0;
    let wakeLock = null;

    window.onload = () => {
        loadDataFromStorage();
        log("System Ready. Click START to begin.");
    };

    function log(msg) {
        const t = document.getElementById('terminal');
        const div = document.createElement('div');
        div.innerText = `> [${new Date().toLocaleTimeString()}] ${msg}`;
        t.prepend(div);
        if (t.childNodes.length > 40) t.lastChild.remove();
    }

    async function toggleEngine() {
        if (!isRunning) {
            isRunning = true;
            document.getElementById('startBtn').innerText = "ENGINE ACTIVE (SCANNING)";
            document.getElementById('startBtn').style.background = "#222";
            document.getElementById('startBtn').style.color = "#888";
            log("Engine Started. Sequential Polling Active.");
            
            // Wake Lock to prevent sleep
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
            }
            
            // Interaction to enable sound
            document.getElementById('alarm').play().then(() => document.getElementById('alarm').pause());
            
            runSequence();
        }
    }

    // This prevents lag by waiting for the previous fetch to finish
    async function runSequence() {
        if (!isRunning) return;

        const currentCexAddr = walletKeys[currentIndex];
        const currentCexName = CEX_WALLETS[currentCexAddr];

        await scanCEX(currentCexAddr, currentCexName);

        currentIndex = (currentIndex + 1) % walletKeys.length;
        
        // Wait 1.5 seconds before next CEX scan to avoid 429 errors
        setTimeout(runSequence, 1500);
    }

    async function scanCEX(addr, name) {
        log(`Probing ${name}...`);
        try {
            const url = `https://api.helius.xyz/v0/addresses/${addr}/transactions?api-key=${API_KEY}`;
            const res = await fetch(url);
            if (!res.ok) return;
            const txs = await res.json();

            if (!txs || txs.length === 0) return;

            for (const tx of txs) {
                if (seenSigs.has(tx.signature)) continue;
                seenSigs.add(tx.signature);

                if (tx.nativeTransfers) {
                    for (const transfer of tx.nativeTransfers) {
                        if (transfer.fromUserAccount === addr && transfer.amount > 10000000) {
                            await verifyNewWallet(transfer.toUserAccount, transfer.amount / 1000000000, name, tx.signature);
                        }
                    }
                }
            }
        } catch (e) {}
    }

    async function verifyNewWallet(wallet, amount, exchange, sig) {
        try {
            const url = `https://api.helius.xyz/v0/addresses/${wallet}/transactions?api-key=${API_KEY}`;
            const res = await fetch(url);
            const data = await res.json();

            // Brand New Wallet Check
            if (data && data.length <= 3) {
                saveNewInsider(wallet, amount, exchange, sig);
            }
        } catch (e) {}
    }

    function saveNewInsider(wallet, amount, exchange, sig) {
        let history = JSON.parse(localStorage.getItem('sniper_v16_history') || '[]');
        if (history.some(h => h.wallet === wallet)) return;

        const newHit = { wallet, amount, exchange, sig, time: Date.now() };
        history.push(newHit);
        localStorage.setItem('sniper_v16_history', JSON.stringify(history));

        if (Notification.permission === "granted") {
            new Notification("🚨 INSIDER ALERT", { body: `${exchange} -> ${amount} SOL` });
        } else {
            Notification.requestPermission();
        }

        renderCard(newHit, true);
        triggerAlarm();
    }

    function renderCard(item, isNew = false) {
        const feed = document.getElementById('feed');
        const card = document.createElement('div');
        card.className = `wallet-card ${isNew ? 'new-hit' : ''}`;
        const ageInMins = Math.floor((Date.now() - item.time) / 60000);

        card.innerHTML = `
            <div style="background:#fff; color:#000; font-size:10px; font-weight:bold; padding:2px 5px; border-radius:3px; position:absolute; top:10px; right:10px;">CEX CONFIRMED</div>
            <div style="color:var(--neon); font-weight:bold; font-size:14px;">🚨 NEW INSIDER WALLET</div>
            <div class="address-box" onclick="copy('${item.wallet}')">${item.wallet}</div>
            <div class="info">FROM: <span class="val">${item.exchange}</span> | SOL: <span class="val">${item.amount.toFixed(2)}</span></div>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <a href="https://photon-sol.tinyastro.io/en/lp/${item.wallet}" target="_blank" style="flex:1; background:#0088ff; color:#fff; text-align:center; padding:12px; border-radius:5px; text-decoration:none; font-weight:bold; font-size:12px;">PHOTON</a>
                <a href="https://solscan.io/tx/${item.sig}" target="_blank" style="flex:1; background:#222; color:#fff; text-align:center; padding:12px; border-radius:5px; text-decoration:none; font-size:12px;">SOLSCAN</a>
            </div>
            <div class="footer-time">Found ${ageInMins}m ago</div>
        `;
        if (isNew) feed.prepend(card);
        else feed.appendChild(card);
    }

    function loadDataFromStorage() {
        const feed = document.getElementById('feed');
        feed.innerHTML = '';
        const history = JSON.parse(localStorage.getItem('sniper_v16_history') || '[]');
        const oneDay = 24 * 60 * 60 * 1000;
        
        // Remove data older than 24h
        const fresh = history.filter(h => (Date.now() - h.time) < oneDay);
        localStorage.setItem('sniper_v16_history', JSON.stringify(fresh));
        
        fresh.sort((a,b) => b.time - a.time).forEach(h => renderCard(h));
    }

    function triggerAlarm() {
        const flash = document.getElementById('flash');
        const alarm = document.getElementById('alarm');
        flash.style.display = 'block';
        alarm.currentTime = 0;
        alarm.play();
        setTimeout(() => { flash.style.display = 'none'; alarm.pause(); }, 5000);
    }

    function copy(t) {
        navigator.clipboard.writeText(t);
        alert("CA Copied!");
    }
</script>
</body>
</html>

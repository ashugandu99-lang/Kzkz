<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ INFINITE AUTO-SNIPER V17</title>
    <style>
        :root { --neon: #00ff66; --bg: #000; --red: #ff003c; }
        body { background: #000; color: #fff; font-family: 'Courier New', monospace; margin: 0; padding: 0; overflow-x: hidden; }
        .header { background: #111; padding: 12px; border-bottom: 2px solid var(--neon); text-align: center; position: sticky; top: 0; z-index: 1000; }
        #flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 255, 102, 0.4); display: none; z-index: 9999; pointer-events: none; }
        
        /* TERMINAL LOGS */
        #terminal { background: #050505; color: #0f0; font-size: 10px; padding: 10px; height: 160px; overflow-y: auto; border-bottom: 2px solid #222; line-height: 1.5; }
        .log-entry { border-left: 2px solid var(--neon); padding-left: 8px; margin-bottom: 3px; animation: fadeIn 0.2s; }
        
        .container { padding: 10px; }
        .wallet-card { background: #111; border: 1px solid #333; border-radius: 15px; padding: 20px; margin-bottom: 15px; position: relative; animation: slideUp 0.4s ease; }
        .new-hit { border: 2px solid var(--neon) !important; box-shadow: 0 0 25px var(--neon); }
        
        .address-box { background: #000; border: 1px dashed var(--neon); padding: 15px; margin: 12px 0; border-radius: 8px; font-weight: bold; color: #fff; word-break: break-all; text-align: center; cursor: pointer; font-size: 14px; }
        .info { font-size: 12px; color: #aaa; margin: 5px 0; }
        .val { color: var(--neon); font-weight: bold; }
        .time-tag { font-size: 9px; color: #444; text-align: right; margin-top: 8px; }

        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } }
        @keyframes fadeIn { from { opacity: 0; } }
        @keyframes nuclear { 50% { opacity: 0; } }
        .flash-active { animation: nuclear 0.1s infinite; }
    </style>
</head>
<body>

<div id="flash"></div>

<div class="header">
    <div style="font-size: 10px; color: var(--neon); letter-spacing: 1px;">● 24/7 PERSISTENT BLOCKCHAIN STREAM</div>
    <h2 style="margin: 5px 0;">V17 INFINITE SNIPER</h2>
</div>

<div id="terminal"></div>

<div class="container">
    <h3 style="color: var(--neon); font-size: 11px; border-bottom: 1px solid #222; padding-bottom: 8px; text-transform: uppercase;">Saved Insider History (24H)</h3>
    <div id="feed"></div>
</div>

<audio id="alarm" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

<script>
    const API_KEY = "bef5327c-0eb9-407f-b9be-19ce06ef2e57";
    const CEX_WALLETS = {
        "5VCwKtYv8LBa9Bv68y3CznunF3D2asLidvXJStB66Yka": "Binance",
        "AC59pU99X9f32ZdfaHCqAtdtXnZpA3W7aQnC1aEnDEnS": "Bybit",
        "2AQdp621S9L8M7c5Pq9tAEn568YkaEnDEnS": "Coinbase",
        "ASTE8f7mYQ5vGq7Y9X2A8A1S9e7V4E7v7G7g7E7v7G7g": "MEXC",
        "u6YvS1B4toXfubks8E4UvUePHeVdf4m4v": "Kraken"
    };

    let seenSigs = new Set();
    let walletKeys = Object.keys(CEX_WALLETS);
    let currentIndex = 0;
    let wakeLock = null;

    // --- AUTO-START ON LOAD ---
    window.onload = async () => {
        log("System Online. Initializing Auto-Scanner...");
        
        // Load history immediately
        refreshUIFromStorage();
        
        // Request Notification Permission
        if (Notification.permission !== "granted") {
            log("Waiting for Notification permission...");
            Notification.requestPermission();
        }

        // Enable Sound & WakeLock on first user interaction
        document.body.addEventListener('click', () => {
            enableAudio();
            requestWakeLock();
        }, { once: true });

        log("Engine Armed. No manual refresh needed.");
        
        // Start the infinite loop
        runInfiniteLoop();
    };

    function log(msg) {
        const t = document.getElementById('terminal');
        const div = document.createElement('div');
        div.className = "log-entry";
        div.innerText = `> [${new Date().toLocaleTimeString()}] ${msg}`;
        t.prepend(div);
        if (t.childNodes.length > 50) t.lastChild.remove();
    }

    async function runInfiniteLoop() {
        while (true) {
            const currentCexAddr = walletKeys[currentIndex];
            const currentCexName = CEX_WALLETS[currentCexAddr];

            log(`Syncing with ${currentCexName}...`);
            await scanCEX(currentCexAddr, currentCexName);

            // Rotate CEX
            currentIndex = (currentIndex + 1) % walletKeys.length;

            // Controlled delay to prevent lagginess and rate-limits (1.5s)
            await new Promise(r => setTimeout(r, 1500));
        }
    }

    async function scanCEX(addr, name) {
        try {
            const url = `https://api.helius.xyz/v0/addresses/${addr}/transactions?api-key=${API_KEY}`;
            const res = await fetch(url);
            if (!res.ok) return;
            const txs = await res.json();

            if (!txs || txs.length === 0) return;

            for (const tx of txs) {
                if (seenSigs.has(tx.signature)) continue;
                seenSigs.add(tx.signature);

                if (tx.nativeTransfers) {
                    for (const transfer of tx.nativeTransfers) {
                        if (transfer.fromUserAccount === addr && transfer.amount > 1000000) {
                            await verifyNewWallet(transfer.toUserAccount, transfer.amount / 1000000000, name, tx.signature);
                        }
                    }
                }
            }
        } catch (e) {
            log(`Network Lag. Retrying...`);
        }
    }

    async function verifyNewWallet(wallet, amount, exchange, sig) {
        try {
            const url = `https://api.helius.xyz/v0/addresses/${wallet}/transactions?api-key=${API_KEY}`;
            const res = await fetch(url);
            const data = await res.json();

            // SAKHT RULE: BRAND NEW WALLET (History < 3)
            if (data && data.length <= 3) {
                storeHit(wallet, amount, exchange, sig);
            }
        } catch (e) {}
    }

    function storeHit(wallet, amount, exchange, sig) {
        let history = JSON.parse(localStorage.getItem('infinite_sniper_history') || '[]');
        if (history.some(h => h.wallet === wallet)) return;

        const newHit = { wallet, amount, exchange, sig, time: Date.now() };
        history.push(newHit);
        localStorage.setItem('infinite_sniper_history', JSON.stringify(history));

        // Browser Notification
        if (Notification.permission === "granted") {
            new Notification("🚨 INSIDER ALERT", { body: `${exchange} -> ${amount} SOL` });
        }

        renderCard(newHit, true);
        nuclearAlert(exchange);
    }

    function renderCard(item, isNew = false) {
        const feed = document.getElementById('feed');
        const card = document.createElement('div');
        card.className = `wallet-card ${isNew ? 'new-hit' : ''}`;
        const age = Math.floor((Date.now() - item.time) / 60000);

        card.innerHTML = `
            <div style="background:#fff; color:#000; font-size:10px; font-weight:bold; padding:2px 5px; border-radius:3px; position:absolute; top:10px; right:10px;">CEX CONFIRMED</div>
            <div style="color:var(--neon); font-weight:bold; font-size:14px;">🚨 NEW INSIDER WALLET</div>
            <div class="address-box" onclick="copy('${item.wallet}')">${item.wallet}</div>
            <div class="info">FROM: <span class="val">${item.exchange}</span> | SOL: <span class="val">${item.amount.toFixed(2)}</span></div>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <a href="https://photon-sol.tinyastro.io/en/lp/${item.wallet}" target="_blank" style="flex:1; background:#0088ff; color:#fff; text-align:center; padding:12px; border-radius:8px; text-decoration:none; font-weight:bold; font-size:12px;">PHOTON</a>
                <a href="https://solscan.io/tx/${item.sig}" target="_blank" style="flex:1; background:#222; color:#fff; text-align:center; padding:12px; border-radius:5px; text-decoration:none; font-size:12px;">SOLSCAN</a>
            </div>
            <div class="time-tag">Found ${age}m ago</div>
        `;
        if (isNew) feed.prepend(card);
        else feed.appendChild(card);
    }

    function refreshUIFromStorage() {
        const feed = document.getElementById('feed');
        feed.innerHTML = '';
        let history = JSON.parse(localStorage.getItem('infinite_sniper_history') || '[]');
        const oneDay = 24 * 60 * 60 * 1000;
        
        // Remove old data > 24h
        const fresh = history.filter(h => (Date.now() - h.time) < oneDay);
        localStorage.setItem('infinite_sniper_history', JSON.stringify(fresh));
        
        fresh.sort((a,b) => b.time - a.time).forEach(h => renderCard(h));
    }

    function nuclearAlert(exchange) {
        const flash = document.getElementById('flash');
        const alarm = document.getElementById('alarm');
        log(`💰 HIT! ${exchange} Insider Detected!`, true);
        
        flash.style.display = 'block';
        flash.classList.add('flash-active');
        alarm.currentTime = 0;
        alarm.play();
        
        setTimeout(() => { flash.style.display = 'none'; flash.classList.remove('flash-active'); alarm.pause(); }, 5000);
    }

    async function requestWakeLock() {
        if ('wakeLock' in navigator) {
            try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
        }
    }

    function enableAudio() {
        document.getElementById('alarm').play().then(() => document.getElementById('alarm').pause());
        log("Audio & WakeLock Enabled.");
    }

    function copy(t) {
        navigator.clipboard.writeText(t);
        alert("Wallet Address Copied!");
    }
</script>
</body>
</html>
